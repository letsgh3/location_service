# .github/workflows/tests.yml
# Uruchamia testy backendu (pytest + coverage) przy każdym push i pull request.
# Pokrycie poniżej 80% (linie + gałęzie) kończy workflow niepowodzeniem.
# coverage.xml trafia też do Codecov (status codecov/patch: min. 90% pokrycia zmienionych linii, codecov.yml).
# Job mutation (mutmut) startuje dopiero po zielonym backend-tests; score < 60% = błąd.
name: Tests

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/backend/pyproject.toml

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Run tests with coverage
        run: >-
          pytest -q
          --cov
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-fail-under=80

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: services/backend/coverage.xml
          if-no-files-found: warn

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: services/backend/coverage.xml
          flags: backend
          fail_ci_if_error: true

  mutation:
    needs: backend-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/backend/pyproject.toml

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Run mutation testing
        run: mutmut run --max-children 4

      - name: Build mutation report
        if: always()
        run: |
          mutmut export-cicd-stats
          mutmut results --all true > mutants/mutmut-results.txt 2>&1 || true

      - name: Check mutation score (min 60%)
        run: python scripts/mutation_score.py --min 60

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: |
            services/backend/mutants/mutmut-cicd-stats.json
            services/backend/mutants/mutmut-results.txt
          if-no-files-found: warn
