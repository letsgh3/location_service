[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "programming-tools-ai"
version = "0.1.0"
description = "FastAPI + SQLite (SQLAlchemy async) application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.104.1",
    "pydantic==2.9.2",
    "uvicorn[standard]==0.24.0",
    "sqlalchemy==2.0.23",
    "alembic==1.12.1",
    "aiosqlite==0.19.0",
    "greenlet==3.0.1",
    "pydantic-settings==2.5.2",
    "PyJWT==2.9.0",
    "bcrypt==4.2.1",
    "python-multipart==0.0.9",
    "email-validator==2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "httpx==0.27.2",
    "pytest-cov==6.0.0",
    "mutmut==3.8.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
# Kod aplikacji (bez testów, migracji i skryptów).
source = ["main", "config", "sql_app"]
branch = true
# SQLAlchemy async wykonuje kod w greenletach; bez tego coverage gubi linie po await.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true

[tool.mutmut]
# Mutowany jest kod aplikacji; init_db.py tylko woła alembic i nie ma testów.
source_paths = ["main.py", "sql_app/"]
do_not_mutate = ["sql_app/init_db.py"]
also_copy = ["config.py"]
pytest_add_cli_args_test_selection = ["tests/"]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["sql_app*"]
